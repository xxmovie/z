<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Trending Movies Online</title>
    
    <!-- Meta Data Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trending Movies Today - Watch Online" />
    <meta property="og:description" content="Stream the latest trending movies in HD quality." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1200&auto=format&fit=crop" />

    <style>
        /* CSS Reset & Variables */
        :root {
            --bg-color: #0b0f19;
            --surface: #151a27;
            --text-main: #f1f5f9;
            --accent: #e50914;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.4;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Header / Title */
        .header-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 4px 0;
            padding-left: 8px;
            border-left: 4px solid var(--accent);
            background-color: var(--surface);
            padding: 10px 10px 10px 12px;
            border-radius: 4px;
        }

        /* Movie Grid Section */
        .grid {
            display: grid;
            grid-template-columns: 1fr; /* 1 Kolom untuk PC & Mobile */
            gap: 6px;
        }

        .movie-card {
            position: relative;
            aspect-ratio: 16 / 9; /* Rasio 16:9 */
            background-color: var(--surface);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Support video untuk menutupi seluruh container */
        .movie-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Video Meta Info (Durasi & Views) */
        .meta-info {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            justify-content: space-between;
            pointer-events: none; /* Agar klik tetap menembus ke movie-card */
        }

        .meta-badge {
            background-color: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.3px;
        }

        /* Ikon Play Melayang untuk video yang tidak auto-play */
        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            backdrop-filter: blur(2px);
        }

        .play-overlay svg {
            width: 24px;
            height: 24px;
            fill: #fff;
            margin-left: 4px; /* Untuk menyeimbangkan ikon segitiga play */
        }

        /* Loading State */
        .loading-text {
            text-align: center;
            padding: 20px;
            grid-column: 1 / -1;
            color: #94a3b8;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .grid { gap: 6px; }
            .header-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Title -->
        <div class="header-title">Trending Movies Today</div>
        
        <!-- Grid Film -->
        <div class="grid" id="movie-grid">
            <div class="loading-text">Loading content...</div>
        </div>
    </div>

    <script>
        // ==========================================================
        //                       PENGATURAN
        // ==========================================================
        const LINK_FILE = 'https://seribudollarperhari.github.io/banner/link.txt'; // Sumber list URL Offer
        
        // TARGET_URL diubah menggunakan 'let' dan diberi link default
        let TARGET_URL = 'https://spreadpreferencetelevision.com/hhqe0ruxga?key=e3ff974fd2665b1074e29d32efa30da4';
        
        // Kumpulan Video
        const VIDEO_LIST = [
            "https://res.cloudinary.com/crbsbqto/video/upload/v1788607841/9.mp4",
            "https://res.cloudinary.com/crbsbqto/video/upload/v1788607841/6.mp4",
            "https://res.cloudinary.com/crbsbqto/video/upload/v1788607814/7.mp4",
            "https://res.cloudinary.com/crbsbqto/video/upload/v1788607801/10.mp4",
            "https://res.cloudinary.com/crbsbqto/video/upload/v1788607798/8.mp4",
            "https://res.cloudinary.com/crbsbqto/video/upload/v1788607792/4.mp4",
            "https://res.cloudinary.com/crbsbqto/video/upload/v1788607789/3.mp4",
            "https://res.cloudinary.com/crbsbqto/video/upload/v1788607782/2.mp4",
            "https://res.cloudinary.com/crbsbqto/video/upload/v1788607775/1.mp4",
            "https://res.cloudinary.com/crbsbqto/video/upload/v1788607770/5.mp4",
            "https://res.cloudinary.com/crbsbqto/video/upload/v1788607755/11.mp4"
        ];
        // ==========================================================

        // Fungsi Redirect saat konten di-klik
        function redirectToOffer() {
            if(TARGET_URL) {
                window.location.href = TARGET_URL;
            }
        }

        // Script Deteksi Facebook / In-App Browser
        function checkInAppBrowser() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isInAppBrowser = /FBAN|FBAV|Instagram|TikTok|Line|Twitter|Threads/i.test(ua);
            const isAndroid = /android/i.test(ua);
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            
            if (isInAppBrowser && TARGET_URL) {
                let parsedUrl;
                try {
                    parsedUrl = new URL(TARGET_URL);
                } catch(e) {
                    parsedUrl = new URL("https://" + TARGET_URL.replace(/^https?:\/\//, ''));
                }
                
                let intentTarget = parsedUrl.host + parsedUrl.pathname + parsedUrl.search;
                let normalHref = parsedUrl.href;
                let fallbackEncoded = encodeURIComponent(normalHref);
                
                let actionHTML = '';
                if (isAndroid) {
                    const intentUrl = `intent://${intentTarget}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${fallbackEncoded};end`;
                    actionHTML = `<a href="${intentUrl}" class="ia-btn primary">Continue</a>`;
                } else if (isIOS) {
                    actionHTML = `<span style="font-size:13px; color:#666; text-align:right; font-weight:600;">Tap <b>...</b> (menu)<br>Open in Safari</span>`;
                } else {
                    actionHTML = `<a href="${normalHref}" class="ia-btn primary">Continue</a>`;
                }
                
                const sheetCSS = `<style>
                    .ia-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:999998;display:flex;align-items:flex-end;justify-content:center}
                    .ia-sheet{width:100%;max-width:600px;background:#fff;border-radius:20px 20px 0 0;padding:25px 20px;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;box-shadow:0 -4px 15px rgba(0,0,0,0.1);animation:slideUp 0.3s ease-out forwards}
                    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
                    .ia-header{text-align:center;font-size:17px;font-weight:700;color:#050505;padding-bottom:15px;border-bottom:1px solid #ced0d4;margin-bottom:20px}
                    .ia-row{display:flex;align-items:center;justify-content:space-between}
                    .ia-left{display:flex;align-items:center;gap:15px}
                    .ia-icon{width:42px;height:42px}
                    .ia-text{font-size:16px;font-weight:600;color:#050505}
                    .ia-btn{background:#e4e6eb;color:#050505;font-size:15px;font-weight:600;padding:10px 24px;border-radius:24px;text-decoration:none;transition:0.2s}
                    .ia-btn.primary{background:#0866ff;color:#fff}
                </style>`;
                
                const sheetHTML = `
                <div class="ia-overlay">
                    <div class="ia-sheet">
                        <div class="ia-header">Open in Browser...</div>
                        <div class="ia-row">
                            <div class="ia-left">
                                <svg class="ia-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M24 10C16.27 10 10 16.27 10 24C10 31.73 16.27 38 24 38C31.73 38 38 31.73 38 24C38 16.27 31.73 10 24 10ZM24 13.5C28.42 13.5 32.2 16.23 33.72 20H16.24C17.97 16.03 21.84 13.5 24 13.5ZM13.88 26.5C13.62 25.7 13.5 24.87 13.5 24C13.5 22.18 14.04 20.48 14.97 19.06L23.75 34.27C18.66 33.84 14.63 30.64 13.88 26.5ZM24 28.5C21.51 28.5 19.5 26.49 19.5 24C19.5 21.51 21.51 19.5 24 19.5C26.49 19.5 28.5 21.51 28.5 24C28.5 26.49 26.49 28.5 24 28.5ZM24.47 34.48L17.7 22.75H32.48C32.8 24.08 33.15 25.5 33.15 27C33.15 31.06 29.83 34.39 25.7 34.48C25.29 34.49 24.88 34.49 24.47 34.48ZM34.27 24C34.27 25.13 34.07 26.21 33.7 27.21L26.31 14.43C30.93 15.65 34.27 19.45 34.27 24Z" fill="#4285F4"/>
                                    <path d="M24 19.5C21.51 19.5 19.5 21.51 19.5 24C19.5 26.49 21.51 28.5 24 28.5C26.49 28.5 28.5 26.49 28.5 24C28.5 21.51 26.49 19.5 24 19.5Z" fill="#FFFFFF"/>
                                </svg>
                                <span class="ia-text">Chrome / Browser</span>
                            </div>
                            ${actionHTML}
                        </div>
                    </div>
                </div>`;
                
                document.body.style.overflow = 'hidden';
                document.body.insertAdjacentHTML('beforeend', sheetCSS + sheetHTML);
            }
        }

        // Fungsi Generate Angka Random untuk Durasi dan Views
        function generateRandomMeta() {
            // Durasi (Acak 20 sampai 50 Menit)
            const minutes = Math.floor(Math.random() * 31) + 20; 
            const seconds = Math.floor(Math.random() * 60).toString().padStart(2, '0');
            const duration = `${minutes}:${seconds}`;

            // Views (Acak mulai dari 500 sampai ke jutaan)
            const rawViews = Math.floor(Math.random() * 899500) + 500;
            // Format agar menjadi K (Ribuan) atau M (Jutaan) jika angkanya besar
            let formattedViews = "";
            if (rawViews >= 1000000) {
                formattedViews = (rawViews / 1000000).toFixed(1) + 'M';
            } else if (rawViews >= 1000) {
                formattedViews = (rawViews / 1000).toFixed(1) + 'K';
            } else {
                formattedViews = rawViews;
            }

            return { duration, views: `${formattedViews} Views` };
        }

        // Script Merender Video dari Array ke Grid
        function loadVideosToGrid() {
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '';
            
            // Acak urutan video agar tampil beda setiap halaman di muat
            const shuffledVideos = VIDEO_LIST.sort(() => 0.5 - Math.random());

            shuffledVideos.forEach((videoUrl, index) => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = redirectToOffer;
                
                // Ambil data acak durasi dan views
                const meta = generateRandomMeta();
                let videoElement = "";
                let playIconElement = "";

                if (index === 0) {
                    // Konten pertama: Autoplay, loop, muted
                    videoElement = `<video src="${videoUrl}" autoplay loop muted playsinline loading="lazy"></video>`;
                } else {
                    // Konten lainnya: Hanya thumbnail (Tanpa autoplay) dengan ikon play di tengah
                    videoElement = `<video src="${videoUrl}#t=0.1" muted playsinline preload="metadata"></video>`;
                    playIconElement = `
                        <div class="play-overlay">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>
                    `;
                }
                
                // Rakit komponen card HTML
                card.innerHTML = `
                    ${videoElement}
                    ${playIconElement}
                    <div class="meta-info">
                        <div class="meta-badge">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            ${meta.views}
                        </div>
                        <div class="meta-badge">${meta.duration}</div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Fungsi Utama untuk Menjalankan Semua Setup Secara Berurutan
        async function initApp() {
            // 1. Ambil list URL dan tetapkan satu link acak sebagai TARGET_URL
            try {
                const linkResponse = await fetch(LINK_FILE);
                if (linkResponse.ok) {
                    const linkText = await linkResponse.text();
                    const urls = linkText.split(/\r?\n/).filter(line => line.trim() !== '');
                    
                    if (urls.length > 0) {
                        // Pilih 1 URL dari text secara acak
                        TARGET_URL = urls[Math.floor(Math.random() * urls.length)].trim();
                    }
                }
            } catch (error) {
                console.error("Gagal memuat file link.txt, sistem akan menggunakan link default.", error);
            }

            // 2. Terapkan logika In-App Browser Facebook
            checkInAppBrowser();

            // 3. Load Video ke dalam Grid
            loadVideosToGrid();
        }

        // Mulai aplikasi setelah halaman (DOM) siap diload
        document.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>
</html>
